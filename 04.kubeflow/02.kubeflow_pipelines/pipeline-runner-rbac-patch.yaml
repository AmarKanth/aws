apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner-argo-patch
  namespace: kubeflow
rules:
- apiGroups:
  - argoproj.io
  resources:
  - workflowtasksets
  - workflowtasksets/status
  - workflows
  - workflows/status
  verbs:
  - get
  - list
  - watch
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner-argo-patch-binding
  namespace: kubeflow
subjects:
- kind: ServiceAccount
  name: pipeline-runner
  namespace: kubeflow
roleRef:
  kind: Role
  name: pipeline-runner-argo-patch
  apiGroup: rbac.authorization.k8s.io
